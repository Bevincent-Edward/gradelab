<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>BevGradz — Jesus loves you</title>
  <defs>
    <linearGradient id="leak" x1="0.12" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.55" stop-color="#FF5C7A"/>
      <stop offset="1" stop-color="#8B6CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A6A" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#FF5C7A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF5C7A" stop-opacity="0"/>
    </radialGradient>
    <!-- the cross is cut out of the heart: love with Christ at its centre -->
    <mask id="cross">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="240" y="148" width="32" height="214" rx="7" fill="#000"/>
      <rect x="184" y="200" width="144" height="32" rx="7" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#0c0c0e"/>
  <circle cx="256" cy="262" r="236" fill="url(#glow)"/>
  <path mask="url(#cross)" fill="url(#leak)"
        d="M256 436 C 132 352 62 280 62 196 C 62 134 108 90 166 90 C 206 90 238 112 256 146 C 274 112 306 90 346 90 C 404 90 450 134 450 196 C 450 280 380 352 256 436 Z"/>
</svg>
