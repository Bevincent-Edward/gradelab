# Render Blueprint: GradeLab is a static site (no server, no build step).
# Everything runs in the visitor's browser; photos and videos never leave
# their device.
services:
  - type: web
    name: gradelab
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Revalidate app files on every load so updates reach phones immediately;
      # icons rarely change and can be cached longer.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=604800
